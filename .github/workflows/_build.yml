name: Build (reusable)

# Single source of truth for tds-shared. Called by ci.yml (PR gate, no
# publish), dev.yml (prerelease → @dev dist-tag) and release.yml (version
# bump → @latest + push tag). Behaviour selected via the inputs below.

on:
  workflow_call:
    inputs:
      publish_tag:
        description: "none = build only (CI); 'dev' = prerelease @dev; 'latest' = real release."
        required: false
        type: string
        default: none
      bump:
        description: Version bump for a 'latest' release (patch | minor | major).
        required: false
        type: string
        default: patch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No permissions: block here - a reusable workflow cannot request more than
    # the caller's token holds, and the repo default is read-only. Each caller
    # grants least-privilege permissions instead.
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PACKAGE_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tracht-digital-solutions'

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Publish prerelease (@dev)
        if: ${{ inputs.publish_tag == 'dev' }}
        run: |
          base=$(node -p "require('./package.json').version")
          npm version "${base}-dev.${{ github.run_number }}" --no-git-tag-version
          npm publish --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Release (@latest) + push tag
        if: ${{ inputs.publish_tag == 'latest' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.bump }} -m "release: %s"
          npm publish
          git push --follow-tags origin HEAD:main
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Prune old release tags (keep newest 5)
        # Retain only the 5 most recent version tags; delete the rest on the
        # remote so the tag list never grows unbounded. Version-aware sort, so
        # the just-pushed tag is always kept. Published package versions in
        # GitHub Packages are unaffected - this only trims git tags.
        if: ${{ inputs.publish_tag == 'latest' }}
        run: |
          git fetch --tags --force --quiet
          old=$(git tag --sort=-v:refname | tail -n +6)
          if [ -z "$old" ]; then
            echo "5 or fewer tags - nothing to prune."
            exit 0
          fi
          echo "Pruning $(echo "$old" | wc -l | tr -d ' ') old tag(s):"
          echo "$old"
          for t in $old; do
            git push origin ":refs/tags/$t"
          done
