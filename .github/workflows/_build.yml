name: Build (reusable)

on:
  workflow_call:
    inputs:
      publish_tag:
        required: false
        type: string
        default: none
      bump:
        required: false
        type: string
        default: patch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - run: echo "publish_tag=${{ inputs.publish_tag }} bump=${{ inputs.bump }}"
