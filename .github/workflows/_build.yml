name: Build (reusable)

# Single source of truth for tds-shared. Called by ci.yml (PR gate, no
# publish), dev.yml (prerelease → @dev dist-tag) and release.yml (version
# bump → @latest + push tag). Behaviour selected via the inputs below.

on:
  workflow_call:
    inputs:
      publish_tag:
        description: "none = build only (CI); 'dev' = prerelease @dev; 'latest' = real release."
        required: false
        type: string
        default: none
      bump:
        description: Version bump for a 'latest' release (patch | minor | major).
        required: false
        type: string
        default: patch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No permissions: block here - a reusable workflow cannot request more than
    # the caller's token holds, and the repo default is read-only. Each caller
    # grants least-privilege permissions instead.
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PACKAGE_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tracht-digital-solutions'

      - name: Install
        run: npm ci

      # install/ is PHP inside an npm package, so nothing else in this pipeline
      # ever parses it — not tsc, not vitest, not the build. A syntax error
      # there ships, and the first thing that reads it is an operator's browser
      # on a production host. Ubuntu runners have PHP already.
      - name: Lint installer PHP
        run: |
          for f in install/*.php install/profiles/*.php; do
            php -l "$f"
          done

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Publish prerelease (@dev)
        if: ${{ inputs.publish_tag == 'dev' }}
        run: |
          base=$(node -p "require('./package.json').version")
          npm version "${base}-dev.${{ github.run_number }}" --no-git-tag-version
          npm publish --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Release (@latest) + push tag
        if: ${{ inputs.publish_tag == 'latest' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.bump }} -m "release: %s"
          npm publish
          git push --follow-tags origin HEAD:main
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Prune old release tags (keep newest 5)
        # Retain only the 5 most recent version tags; delete the rest on the
        # remote so the tag list never grows unbounded. Version-aware sort, so
        # the just-pushed tag is always kept. This only trims git tags - the
        # published GitHub Packages versions are pruned by the steps below.
        if: ${{ inputs.publish_tag == 'latest' }}
        run: |
          git fetch --tags --force --quiet
          old=$(git tag --sort=-v:refname | tail -n +6)
          if [ -z "$old" ]; then
            echo "5 or fewer tags - nothing to prune."
            exit 0
          fi
          echo "Pruning $(echo "$old" | wc -l | tr -d ' ') old tag(s):"
          echo "$old"
          for t in $old; do
            git push origin ":refs/tags/$t"
          done

      # --- GitHub Packages version retention -----------------------------------
      # Keeps the registry bounded. Prereleases (...-dev.<run>) accumulate on
      # every push to main, so they are pruned on both dev and release runs;
      # stable versions only change on a release, so they are pruned there.
      # Requires PACKAGE_TOKEN to carry `delete:packages` (classic PAT) in
      # addition to write:packages, and to be SSO-authorized for the org.

      - name: Prune old prerelease package versions (keep newest 5)
        # delete-only-pre-release-versions filters to versions whose name has a
        # hyphen (our `<ver>-dev.<run>`), then keeps the newest 5 of those.
        if: ${{ inputs.publish_tag != 'none' }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: tds-shared
          package-type: npm
          min-versions-to-keep: 5
          delete-only-pre-release-versions: 'true'
          token: ${{ secrets.PACKAGE_TOKEN }}

      - name: Prune old stable package versions (keep newest 10)
        # ignore-versions removes every prerelease (any name containing a
        # hyphen) from consideration first, so the keep-count applies purely to
        # real releases - the newest 10 stable versions are retained.
        if: ${{ inputs.publish_tag == 'latest' }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: tds-shared
          package-type: npm
          min-versions-to-keep: 10
          ignore-versions: '^.*-.*$'
          token: ${{ secrets.PACKAGE_TOKEN }}
