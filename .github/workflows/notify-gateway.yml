name: Notify gateway (reusable)

# Reusable repository_dispatch that tells tds-api-gateway to reassemble its
# `build` bundle with an API's new code. Called by each API CI after a
# green push to main. Skips quietly when the token isn't configured.
#
# Call with:
#   uses: Tracht-Digital-Solutions/tds-shared/.github/workflows/notify-gateway.yml@main
#   secrets: inherit

on:
  workflow_call:
    secrets:
      GATEWAY_DISPATCH_TOKEN:
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Dispatch api-pushed to tds-api-gateway
        env:
          GATEWAY_DISPATCH_TOKEN: ${{ secrets.GATEWAY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GATEWAY_DISPATCH_TOKEN" ]; then
            echo "GATEWAY_DISPATCH_TOKEN not set - skipping gateway dispatch."
            exit 0
          fi
          echo "Dispatching api-pushed to tds-api-gateway..."
          curl -fsS -X POST \
            -H "Authorization: Bearer $GATEWAY_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Tracht-Digital-Solutions/tds-api-gateway/dispatches \
            -d "{\"event_type\":\"api-pushed\",\"client_payload\":{\"repo\":\"${GITHUB_REPOSITORY}\",\"sha\":\"${GITHUB_SHA}\"}}"
          echo "Gateway dispatch sent."
